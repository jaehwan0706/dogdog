spring:
  datasource:
    url: jdbc:h2:mem:dangsanchaek;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  oauth:
    mock-enabled: true
  payment:
    mode: mock
  admin:
    emails: admin@test.dev
